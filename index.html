<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | Ludiflex</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Script SDK EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    
    <!-- Firebase App (Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, FacebookAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Konfigurasi Firebase (Ganti dengan konfigurasi Firebase project Mas Aji)
        const firebaseConfig = {
            apiKey: "MASUKKAN_FIREBASE_API_KEY_ANDA",
            authDomain: "MASUKKAN_PROJECT_ID.firebaseapp.com",
            projectId: "MASUKKAN_PROJECT_ID",
            storageBucket: "MASUKKAN_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Fungsi Google Login
        document.getElementById('google-login-btn').addEventListener('click', (e) => {
            e.preventDefault();
            const provider = new GoogleAuthProvider();
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    handleSocialLoginSuccess(user.displayName || user.email.split('@')[0], user.email);
                }).catch((error) => {
                    console.error("Google Login Error:", error);
                    alert("Google Login Failed: " + error.message);
                });
        });

        // Fungsi Facebook Login
        document.getElementById('facebook-login-btn').addEventListener('click', (e) => {
            e.preventDefault();
            const provider = new FacebookAuthProvider();
            signInWithPopup(auth, provider)
                .then((result) => {
                    const user = result.user;
                    handleSocialLoginSuccess(user.displayName || user.email.split('@')[0], user.email);
                }).catch((error) => {
                    console.error("Facebook Login Error:", error);
                    alert("Facebook Login Failed: " + error.message);
                });
        });

        function handleSocialLoginSuccess(username, email) {
            // Cek apakah akun baru (simulasi sederhana dengan localStorage)
            if (!localStorage.getItem(`account_${username}`)) {
                localStorage.setItem(`account_${username}`, "social_login_user");
                localStorage.setItem(`email_${email}`, username);
                
                // Kirim Email Notifikasi ke Yahoo Mas Aji
                sendRegistrationNotification(username, email);
            }

            localStorage.setItem('ludiflex_user', username);
            showDashboard(username);
        }
    </script>

    <style>
        /* FONT */
        @import url("https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap");

        /* COLORS */
        :root {
          --color-background: #f0f0f0;
          --color-text: #333;
          --color-border: #ccc;
          --color-placeholder: #777;
          --color-primary: #007bff;
          --color-primary-hover: #0056b3;
          --color-link: #1a73e8;
          --color-error: #dc3545;
          --color-success: #28a745;
          --color-white: #fff;
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: "DM Sans", sans-serif;
        }

        body {
          display: flex;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          background: var(--color-background);
          position: relative;
          overflow: hidden;
        }

        /* --- INTRO ANIMATION STYLES --- */
        #intro-screen {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: var(--color-white);
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          z-index: 9999;
          transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .intro-logo {
          font-size: 42px;
          font-weight: 700;
          color: var(--color-primary);
          letter-spacing: 2px;
          animation: bounceIn 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
          opacity: 0;
        }

        .intro-subtitle {
          font-size: 14px;
          color: var(--color-placeholder);
          margin-top: 8px;
          animation: fadeInUp 1s ease 0.5s forwards;
          opacity: 0;
        }

        @keyframes bounceIn {
          0% { transform: scale(0.5); opacity: 0; }
          70% { transform: scale(1.1); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }

        @keyframes fadeInUp {
          from { transform: translateY(20px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }

        .fade-out {
          opacity: 0 !important;
          visibility: hidden !important;
        }

        /* Background Blob Decorative */
        body::before {
          content: "";
          position: absolute;
          width: 600px;
          height: 600px;
          background-image: url("data:image/svg+xml,%3Csvg id='sw-js-blob-svg' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg' version='1.1'%3E%3Cdefs%3E%3ClinearGradient id='sw-gradient' x1='0' x2='1' y1='1' y2='0'%3E%3Cstop id='stop1' stop-color='rgba(26, 115, 232, 0.15)' offset='0%25'%3E%3C/stop%3E%3Cstop id='stop2' stop-color='rgba(198.136, 106.263, 255, 0.15)' offset='100%25'%3E%3C/stop%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath fill='url(%23sw-gradient)' d='M23.9,-26.9C30.8,-22.8,35.8,-15,36.1,-7.3C36.3,0.4,31.8,8.1,26.6,13.9C21.5,19.8,15.8,23.9,9,27.5C2.2,31.2,-5.7,34.4,-14.6,33.9C-23.4,33.3,-33.1,29,-37.6,21.6C-42.1,14.1,-41.3,3.5,-38.7,-6.1C-36.2,-15.7,-31.8,-24.2,-25,-28.2C-18.3,-32.3,-9.1,-31.9,-0.3,-31.6C8.6,-31.3,17.1,-30.9,23.9,-26.9Z' width='100%25' height='100%25' transform='translate(50 50)' stroke-width='0' style='transition: 0.3s;'%3E%3C/path%3E%3C/svg%3E");
          background-repeat: no-repeat;
          background-size: cover;
          z-index: 0;
        }

        .wrapper {
          position: relative;
          z-index: 1;
          width: 420px;
          background: var(--color-white);
          border: 2px solid rgba(255, 255, 255, 0.2);
          backdrop-filter: blur(20px);
          box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
          color: var(--color-text);
          border-radius: 12px;
          padding: 30px 40px;
        }

        .wrapper h1 {
          font-size: 32px;
          text-align: center;
          margin-bottom: 10px;
        }

        .alert-msg {
          font-size: 11px;
          text-align: center;
          margin-bottom: 15px;
          padding: 8px;
          border-radius: 6px;
          line-height: 1.4;
        }
        .alert-msg.error {
          background-color: #f8d7da;
          color: var(--color-error);
          border: 1px solid #f5c6cb;
        }
        .alert-msg.success {
          background-color: #d4edda;
          color: var(--color-success);
          border: 1px solid #c3e6cb;
        }

        .wrapper .input-box {
          position: relative;
          width: 100%;
          height: 50px;
          margin: 20px 0;
        }

        .input-box input {
          width: 100%;
          height: 100%;
          background: transparent;
          border: none;
          outline: none;
          border: 2px solid var(--color-border);
          border-radius: 40px;
          font-size: 15px;
          color: var(--color-text);
          padding: 20px 45px 20px 20px;
          transition: 0.3s;
        }

        .input-box input::placeholder {
          color: var(--color-placeholder);
        }

        .input-box input:focus {
          border-color: var(--color-primary);
        }

        .input-box.shake {
          animation: shake 0.3s ease-in-out;
        }
        .input-box.shake input {
          border-color: var(--color-error);
        }

        @keyframes shake {
          0%, 100% { transform: translateX(0); }
          20%, 60% { transform: translateX(-6px); }
          40%, 80% { transform: translateX(6px); }
        }

        .input-box i {
          position: absolute;
          right: 20px;
          top: 50%;
          transform: translateY(-50%);
          font-size: 20px;
          color: var(--color-placeholder);
          cursor: pointer;
        }

        .wrapper .remember-forgot {
          display: flex;
          justify-content: space-between;
          font-size: 14px;
          margin: -10px 0 15px;
        }

        .remember-forgot label input {
          accent-color: var(--color-primary);
          margin-right: 4px;
        }

        .remember-forgot a {
          color: var(--color-link);
          text-decoration: none;
        }

        .remember-forgot a:hover {
          text-decoration: underline;
        }

        .wrapper .btn {
          width: 100%;
          height: 45px;
          background: var(--color-primary);
          border: none;
          outline: none;
          border-radius: 40px;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
          cursor: pointer;
          font-size: 15px;
          color: var(--color-white);
          font-weight: 600;
          transition: 0.3s;
        }

        .wrapper .btn:hover {
          background: var(--color-primary-hover);
        }

        .social-text {
          text-align: center;
          font-size: 13px;
          color: var(--color-placeholder);
          margin: 15px 0 10px;
        }

        .social-login {
          display: flex;
          gap: 10px;
          margin-bottom: 15px;
        }

        .social-btn {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          height: 40px;
          border: 2px solid var(--color-border);
          border-radius: 40px;
          text-decoration: none;
          color: var(--color-text);
          font-size: 14px;
          font-weight: 500;
          background: var(--color-white);
          transition: 0.3s;
          cursor: pointer;
        }

        .social-btn:hover {
          background: #f9f9f9;
          border-color: var(--color-primary);
        }

        .wrapper .switch-link {
          font-size: 14px;
          text-align: center;
          margin-top: 15px;
        }

        .switch-link p a {
          color: var(--color-link);
          text-decoration: none;
          font-weight: 600;
          cursor: pointer;
        }

        .switch-link p a:hover {
          text-decoration: underline;
        }

        .hidden {
          display: none !important;
        }
      
        #dashboard-view {
          text-align: center;
        }
        #dashboard-view h2 {
          margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <!-- INTRO ANIMATION SCREEN -->
    <div id="intro-screen">
        <div class="intro-logo">Ludiflex</div>
        <div class="intro-subtitle">Welcome to Your Portal</div>
    </div>

    <div class="wrapper">
        <form id="auth-form">
            <h1 id="form-title">Login</h1>
            <div id="alert-box"></div>
            
            <div class="input-box hidden" id="email-box">
                <input type="email" placeholder="Email" id="email-input">
                <i class='bx bxs-envelope'></i>
            </div>

            <div class="input-box" id="user-box">
                <input type="text" placeholder="Username" id="username" required>
                <i class='bx bxs-user'></i>
            </div>
            
            <div class="input-box" id="pass-box">
                <input type="password" id="password" placeholder="Password" required>
                <i class='bx bxs-lock-alt' id="toggle-btn"></i>
            </div>

            <div class="remember-forgot" id="remember-forgot-box">
                <label><input type="checkbox" id="remember-me"> Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn" id="submit-btn">Login</button>

            <div class="social-text" id="social-divider">Or continue with</div>
            
            <div class="social-login" id="social-box">
                <button type="button" class="social-btn" id="google-login-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
                    Google
                </button>
                <button type="button" class="social-btn" id="facebook-login-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="20px" height="20px"><path fill="#039be5" d="M24 5A19 19 0 1 0 24 43A19 19 0 1 0 24 5Z"/><path fill="#fff" d="M26.572,29.036h4.917l0.772-4.995h-5.69v-2.73c0-2.075,0.678-3.915,2.619-3.915h3.119v-4.359c-0.548-0.074-1.707-0.236-3.897-0.236c-4.573,0-7.254,2.415-7.254,7.917v3.323h-4.701v4.995h4.701v13.729C22.089,42.905,23.032,43,24,43c0.875,0,1.729-0.08,2.572-0.194V29.036z"/></svg>
                    Facebook
                </button>
            </div>

            <div class="switch-link">
                <p id="switch-text">Don't have an account? <a id="toggle-mode-btn">Register</a></p>
            </div>
        </form>

        <div id="dashboard-view" class="hidden">
            <h2>Welcome Back, <span id="user-display"></span>! 🎉</h2>
            <p style="margin-bottom: 20px; color: #666; font-size: 14px;">You are successfully logged in.</p>
            <button class="btn" id="logout-btn">Logout</button>
        </div>
    </div>

    <script>
        // INISIALISASI EMAILJS
        (function(){
            emailjs.init("yBG_8ipbIAXThx8XK");
        })();

        window.addEventListener('load', () => {
            const introScreen = document.getElementById('intro-screen');
            setTimeout(() => {
                introScreen.classList.add('fade-out');
            }, 1800);
        });

        const authForm = document.getElementById('auth-form');
        const dashboardView = document.getElementById('dashboard-view');
        const userDisplay = document.getElementById('user-display');
        const logoutBtn = document.getElementById('logout-btn');
        const alertBox = document.getElementById('alert-box');
        
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('remember-me');
        const toggleBtn = document.getElementById('toggle-btn');

        const formTitle = document.getElementById('form-title');
        const emailBox = document.getElementById('email-box');
        const emailInput = document.getElementById('email-input');
        const rememberForgotBox = document.getElementById('remember-forgot-box');
        const submitBtn = document.getElementById('submit-btn');
        const socialDivider = document.getElementById('social-divider');
        const socialBox = document.getElementById('social-box');
        const switchText = document.getElementById('switch-text');
        const toggleModeBtn = document.getElementById('toggle-mode-btn');
        const userBox = document.getElementById('user-box');
        const passBox = document.getElementById('pass-box');

        let isLoginMode = true;

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('ludiflex_user');
            if (savedUser) {
                showDashboard(savedUser);
            }
        });

        toggleBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.classList.remove('bxs-lock-alt');
                toggleBtn.classList.add('bx-lock-open-alt');
            } else {
                passwordInput.type = 'password';
                toggleBtn.classList.remove('bx-lock-open-alt');
                toggleBtn.classList.add('bxs-lock-alt');
            }
        });

        toggleModeBtn.addEventListener('click', function() {
            isLoginMode = !isLoginMode;
            alertBox.innerHTML = '';

            if (isLoginMode) {
                formTitle.textContent = 'Login';
                submitBtn.textContent = 'Login';
                emailBox.classList.add('hidden');
                emailInput.removeAttribute('required');
                rememberForgotBox.classList.remove('hidden');
                socialDivider.classList.remove('hidden');
                socialBox.classList.remove('hidden');
                switchText.innerHTML = `Don't have an account? <a id="toggle-mode-btn">Register</a>`;
            } else {
                formTitle.textContent = 'Register';
                submitBtn.textContent = 'Register';
                emailBox.classList.remove('hidden');
                emailInput.setAttribute('required', 'true');
                rememberForgotBox.classList.add('hidden');
                socialDivider.classList.add('hidden');
                socialBox.classList.add('hidden');
                switchText.innerHTML = `Already have an account? <a id="toggle-mode-btn">Login</a>`;
            }
            document.getElementById('toggle-mode-btn').addEventListener('click', arguments.callee);
        });

        authForm.addEventListener('submit', function(e) {
            e.preventDefault();
            alertBox.innerHTML = '';

            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!isLoginMode) {
                const email = emailInput.value.trim();

                if (localStorage.getItem(`account_${username}`)) {
                    showAlert('Username is already taken!', 'error');
                    userBox.classList.add('shake');
                    setTimeout(() => userBox.classList.remove('shake'), 300);
                    usernameInput.focus();
                    return;
                }

                if (localStorage.getItem(`email_${email}`)) {
                    showAlert('Email is already registered!', 'error');
                    emailBox.classList.add('shake');
                    setTimeout(() => emailBox.classList.remove('shake'), 300);
                    emailInput.focus();
                    return;
                }

                const isMinLength = password.length >= 8;
                const hasUppercase = /[A-Z]/.test(password);
                const hasSymbol = /[!@#$%^&*(),.?":{}|<>]/.test(password);
                
                const numbers = password.match(/\d/g) || [];
                const uniqueNumbers = new Set(numbers);
                const hasFourUniqueNumbers = numbers.length >= 4 && uniqueNumbers.size >= 4;

                if (!isMinLength || !hasUppercase || !hasSymbol || !hasFourUniqueNumbers) {
                    showAlert('Password must be at least 8 characters, include 1 uppercase letter, 1 symbol, and 4 unique numbers!', 'error');
                    passBox.classList.add('shake');
                    setTimeout(() => passBox.classList.remove('shake'), 300);
                    passwordInput.focus();
                    return;
                }

                localStorage.setItem(`account_${username}`, password);
                localStorage.setItem(`email_${email}`, username);

                sendRegistrationNotification(username, email);

                showAlert('Registration successful! Email notification sent.', 'success');
                setTimeout(() => {
                    toggleModeBtn.click();
                    alertBox.innerHTML = '';
                }, 2000);
            } else {
                const storedPassword = localStorage.getItem(`account_${username}`);
                const validPassword = storedPassword ? storedPassword : "12345"; 

                if (password !== validPassword) {
                    showAlert('Incorrect password or username!', 'error');
                    passBox.classList.add('shake');
                    setTimeout(() => passBox.classList.remove('shake'), 300);
                    passwordInput.value = '';
                    passwordInput.focus();
                } else {
                    if (rememberMeCheckbox.checked) {
                        localStorage.setItem('ludiflex_user', username);
                    }
                    showDashboard(username);
                }
            }
        });

        function sendRegistrationNotification(newUsername, newEmail) {
            const currentTime = new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' });

            const templateParams = {
                name: newUsername,
                user_email: newEmail,
                time: currentTime,
                message: `Pengguna baru telah mendaftar dengan username: ${newUsername} dan email: ${newEmail}`
            };

            emailjs.send('MadatauraGroup', 'template_qnhi7jj', templateParams)
                .then(function(response) {
                    console.log('EMAIL SUCCESS!', response.status, response.text);
                }, function(error) {
                    console.log('EMAIL FAILED...', error);
                });
        }

        function showDashboard(username) {
            authForm.classList.add('hidden');
            dashboardView.classList.remove('hidden');
            userDisplay.textContent = username;
        }

        logoutBtn.addEventListener('click', function() {
            localStorage.removeItem('ludiflex_user');
            dashboardView.classList.add('hidden');
            authForm.classList.remove('hidden');
            usernameInput.value = '';
            passwordInput.value = '';
            emailInput.value = '';
            rememberMeCheckbox.checked = false;
        });

        function showAlert(message, type) {
            alertBox.innerHTML = `<div class="alert-msg ${type}">${message}</div>`;
        }
    </script>

</body>
</html>
